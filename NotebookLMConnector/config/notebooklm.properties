# Google OAuth2 credentials
# Obtené estas credenciales en: https://console.cloud.google.com/apis/credentials
google.client.id=TU_CLIENT_ID_AQUI
google.client.secret=TU_CLIENT_SECRET_AQUI

# Tokens de acceso (generados con el flujo OAuth2)
google.access.token=TU_ACCESS_TOKEN_AQUI
