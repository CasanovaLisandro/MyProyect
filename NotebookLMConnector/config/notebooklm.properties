# Número de proyecto de Google Cloud (es un número puro, NO el ID de texto)
# Project ID (referencia):  intense-nexus-494203-t0
# Project Number: lo encontrás en Cloud Console > Inicio > "Información del proyecto"
google.project.number=TU_NUMERO_DE_PROYECTO

# Región del endpoint de la API: us | eu | global
# Debe coincidir con la región de tu almacén de datos en Discovery Engine
google.endpoint.location=us

# Ubicación geográfica del almacén de datos: global | us | eu
google.location=global

# Token de acceso OAuth2
# Generalo con: gcloud auth print-access-token
# (requiere tener gcloud instalado y autenticado)
google.access.token=TU_ACCESS_TOKEN_AQUI
